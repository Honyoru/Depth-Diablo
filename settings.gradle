plugins {
  // Downloads a matching JDK 21 when a teammate does not have one installed.
  id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'depth-diablo'

// core: game logic, no graphics / audio / input (GDD 3.1.1). desktop: libGDX LWJGL3 shell.
include 'core', 'desktop'
