// Shared build for every module. CI runs `./gradlew check`:
// spotlessCheck -> compile -> test -> JaCoCo gate (core) -> SpotBugs + PMD (GDD 3.1.1, Q125).
plugins {
  id 'com.diffplug.spotless' version '8.11.0' apply false
  id 'com.github.spotbugs' version '6.5.13' apply false
}

allprojects {
  apply plugin: 'eclipse'
  apply plugin: 'idea'
}

subprojects {
  apply plugin: 'java-library'
  apply plugin: 'com.diffplug.spotless'
  apply plugin: 'com.github.spotbugs'
  apply plugin: 'pmd'

  version = projectVersion
  ext.appName = 'Depth Diablo'

  repositories {
    mavenCentral()
  }

  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(21)
    }
  }

  javadoc {
    destinationDir = layout.buildDirectory.dir('docs/javadoc').get().asFile
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xlint:all,-processing,-serial']
  }

  dependencies {
    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "net.jqwik:jqwik:$jqwikVersion"
  }

  test {
    useJUnitPlatform()
    testLogging {
      events 'failed'
      exceptionFormat = 'full'
    }
  }

  // Google Java Style, 100 columns (Q87, Q92). Same version as .vscode/settings.json.
  spotless {
    java {
      target 'src/*/java/**/*.java'
      googleJavaFormat(googleJavaFormatVersion)
    }
  }

  spotbugs {
    toolVersion = spotbugsVersion
    excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
  }
  tasks.named('spotbugsTest') { enabled = false }
  tasks.withType(com.github.spotbugs.snom.SpotBugsTask).configureEach {
    reports {
      html { required = true }
    }
  }

  pmd {
    toolVersion = pmdVersion
    consoleOutput = true
    ruleSets = []
    ruleSetFiles = rootProject.files('config/pmd/ruleset.xml')
  }
  tasks.named('pmdTest') { enabled = false }
}

eclipse.project.name = 'Depth Diablo-parent'
