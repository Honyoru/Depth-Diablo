name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: main            # compare the whole branch to main, not just the last push
          predicate-quantifier: every
          filters: |
            code:
              - '!**.md'
              - '!docs/**'

      - name: Set up Java 21
        if: steps.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runs format check, build, tests, JaCoCo, SpotBugs, and PMD in one daemon pass.
      - name: Verify (Format, Build, Test, Coverage, Static Analysis)
        run: ./gradlew spotlessCheck check --build-cache --parallel --continue

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
